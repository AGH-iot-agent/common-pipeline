name: Node

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: "20"
      install_command:
        required: false
        type: string
        default: "npm ci"
      build_command:
        required: false
        type: string
        default: "npm run build"
      working_directory:
        required: false
        type: string
        default: .
      cache:
        required: false        
        type: string
        default: "npm"

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: [NODE] Check out code
        uses: actions/checkout@v4

      - name: [NODE] Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.cache }}
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: [NODE] Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.install_command }}

      - name: [NODE] Build Node project
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}
