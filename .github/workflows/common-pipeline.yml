name: Common Pipeline

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      project_type:
        required: true
        type: string
        # maven | node
      values_file:
        required: false
        type: string
        default: Helm/values-dev.yaml
      chart_type:
        required: false
        type: string
        default: deployment
      namespace:
        required: false
        type: string
        default: iot-agent
      java_version:
        required: false
        type: string
        default: "21"
      node_version:
        required: false
        type: string
        default: "20"
      deploy:
        required: false
        type: boolean
        default: true
    secrets:
      charts_repo_token:
        required: false

env:
  DOCKER_BUILDKIT: "1"
  IMAGE_OUTPUT_DIR: /mnt/storage/iot-agent/docker-local
  KUBECONFIG: /etc/rancher/k3s/k3s.yaml

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: ${{ inputs.project_type == 'maven' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          check-latest: false
          cache: maven

      - name: Maven build
        if: ${{ inputs.project_type == 'maven' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw && ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      - name: Set up Node.js
        if: ${{ inputs.project_type == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Node build
        if: ${{ inputs.project_type == 'node' }}
        shell: bash
        run: npm ci && npm run build

  docker:
    name: Docker build & store
    runs-on: self-hosted
    needs: build
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        shell: bash
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx version >/dev/null 2>&1; then
            docker build -t "${{ inputs.service_name }}:${{ steps.meta.outputs.tag }}" .
          else
            echo "buildx is unavailable on runner; falling back to classic docker build"
            DOCKER_BUILDKIT=0 docker build -t "${{ inputs.service_name }}:${{ steps.meta.outputs.tag }}" .
          fi

      - name: Save image to disk
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="${IMAGE_OUTPUT_DIR}/${{ inputs.service_name }}"
          archive="${archive_dir}/${{ inputs.service_name }}_${{ steps.meta.outputs.tag }}.tar"
          mkdir -p "$archive_dir"
          docker save -o "$archive" "${{ inputs.service_name }}:${{ steps.meta.outputs.tag }}"

      - name: Import into k3s
        shell: bash
        run: |
          set -euo pipefail
          archive="${IMAGE_OUTPUT_DIR}/${{ inputs.service_name }}/${{ inputs.service_name }}_${{ steps.meta.outputs.tag }}.tar"
          if /usr/local/bin/k3s ctr images ls >/dev/null 2>&1; then
            /usr/local/bin/k3s ctr images import "$archive"
          elif sudo -n /usr/local/bin/k3s ctr images ls >/dev/null 2>&1; then
            sudo -n /usr/local/bin/k3s ctr images import "$archive"
          else
            echo "Insufficient permissions for 'k3s ctr'. Configure passwordless sudo for runner user (k3s command only)." >&2
            exit 1
          fi

  deploy:
    name: Helm deploy
    runs-on: self-hosted
    needs: docker
    if: ${{ inputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Universal Helm Charts
        uses: actions/checkout@v4
        with:
          repository: AGH-iot-agent/Universal-Kubernetes-Helm-Charts
          ref: main
          token: ${{ secrets.CHARTS_REPO_TOKEN || github.token }}
          path: .charts

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Normalize shared chart templates
        shell: bash
        run: |
          set -euo pipefail
          chart_templates_dir=".charts/charts/${{ inputs.chart_type }}/templates"
          root_templates_dir=".charts/templates"

          shopt -s nullglob
          for f in "$chart_templates_dir"/*; do
            [[ -f "$f" ]] || continue
            target="$(tr -d '\r' < "$f")"
            if [[ "$target" =~ ^\.\./\.\./\.\./templates/([A-Za-z0-9._-]+)$ ]]; then
              src="$root_templates_dir/${BASH_REMATCH[1]}"
              if [[ -f "$src" ]]; then
                cp "$src" "$f"
              else
                echo "Missing shared template source: $src" >&2
                exit 1
              fi
            fi
          done

      - name: Deploy
        shell: bash
        run: |
          helm upgrade --install "${{ inputs.service_name }}" \
            ".charts/charts/${{ inputs.chart_type }}" \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --wait --timeout 5m \
            -f "${{ inputs.values_file }}" \
            --set image.repository="${{ inputs.service_name }}" \
            --set image.tag="${{ needs.docker.outputs.image_tag }}" \
            --set image.imagePullPolicy=IfNotPresent
