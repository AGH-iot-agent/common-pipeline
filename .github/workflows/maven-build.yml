name: Maven

on:
	workflow_call:
		inputs:
			java_version:
				required: false
				type: string
				default: "21"
			maven_args:
				required: false
				type: string
				default: "-B clean package -DskipTests"
			working_directory:
				required: false
				type: string
				default: .
      cache:
        required: false
        type: string
        default: "maven"
      distribution:
        required: false
        type: string
        default: "temurin"
      check_latest:
        required: false        
        type: boolean
        default: false

jobs:
	build:
		runs-on: self-hosted
		defaults:
			run:
				working-directory: ${{ inputs.working_directory }}
		steps:
			- name: [MAVEN] Check out code
				uses: actions/checkout@v4

			- name: [MAVEN] Set up JDK
				uses: actions/setup-java@v4
				with:
					distribution: ${{ inputs.distribution }}
					java-version: ${{ inputs.java_version }}
					check-latest: ${{ inputs.check_latest }}
					cache:        ${{ inputs.cache }}

			- name: [MAVEN] Build Maven project
				shell: bash
				run: |
          set -euo pipefail
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw && ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi
