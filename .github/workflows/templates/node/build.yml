name: node build

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: "20"
      install_command:
        required: false
        type: string
        default: "npm ci"
      build_command:
        required: false
        type: string
        default: "npm run build"
      working_directory:
        required: false
        type: string
        default: .

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.install_command }}

      - name: Build Node project
        shell: bash
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}
