name: helm deploy to k3s

on:
	workflow_call:
		inputs:
			service_name:
				required: true
				type: string
			release_name:
				required: true
				type: string
			namespace:
				required: true
				type: string
			chart_type:
				required: true
				type: string
			values_file:
				required: true
				type: string
			image_repository:
				required: true
				type: string
			image_tag:
				required: true
				type: string
			kubeconfig:
				required: false
				type: string
				default: /etc/rancher/k3s/k3s.yaml

jobs:
	deploy:
		runs-on: self-hosted
		steps:
			- name: Check out application repository
				uses: actions/checkout@v4

			- name: Check out universal Helm charts
				uses: actions/checkout@v4
				with:
					repository: AGH-iot-agent/Universal-Kubernetes-Helm-Charts
					path: .universal-helm-charts

			- name: Set up Helm
				uses: azure/setup-helm@v4

			- name: Deploy to local k3s cluster
				shell: bash
				env:
					KUBECONFIG: ${{ inputs.kubeconfig }}
				run: |
					set -euo pipefail

					chart_path=".universal-helm-charts/charts/${{ inputs.chart_type }}"

					if [[ ! -d "$chart_path" ]]; then
						echo "Chart path not found: $chart_path"
						exit 1
					fi

					if [[ ! -f "${{ inputs.values_file }}" ]]; then
						echo "Values file not found: ${{ inputs.values_file }}"
						exit 1
					fi

					helm upgrade --install "${{ inputs.release_name }}" "$chart_path" \
						--namespace "${{ inputs.namespace }}" \
						--create-namespace \
						--wait \
						--timeout 5m \
						-f "${{ inputs.values_file }}" \
						--set name="${{ inputs.service_name }}" \
						--set image.repository="${{ inputs.image_repository }}" \
						--set image.tag="${{ inputs.image_tag }}"
