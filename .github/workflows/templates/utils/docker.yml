name: docker build and store locally

on:
	workflow_call:
		inputs:
			image_repository:
				required: true
				type: string
			image_tag:
				required: true
				type: string
			docker_context:
				required: false
				type: string
				default: .
			dockerfile:
				required: false
				type: string
				default: Dockerfile
			image_output_dir:
				required: false
				type: string
				default: /var/lib/iot-agent/images
			store_image_locally:
				required: false
				type: boolean
				default: true
			import_to_k3s:
				required: false
				type: boolean
				default: true

jobs:
	docker:
		runs-on: self-hosted
		steps:
			- name: Check out code
				uses: actions/checkout@v4

			- name: Build Docker image
				shell: bash
				run: |
					set -euo pipefail
					image_ref="${{ inputs.image_repository }}:${{ inputs.image_tag }}"
					docker build -f "${{ inputs.dockerfile }}" -t "$image_ref" "${{ inputs.docker_context }}"

			- name: Store Docker image on local disk
				if: ${{ inputs.store_image_locally }}
				shell: bash
				run: |
					set -euo pipefail
					image_ref="${{ inputs.image_repository }}:${{ inputs.image_tag }}"
					archive_name="$(echo "${{ inputs.image_repository }}_${{ inputs.image_tag }}" | tr '/:' '__').tar"
					mkdir -p "${{ inputs.image_output_dir }}"
					docker save -o "${{ inputs.image_output_dir }}/${archive_name}" "$image_ref"
					echo "Stored image at ${{ inputs.image_output_dir }}/${archive_name}"

			- name: Import image into local k3s
				if: ${{ inputs.import_to_k3s }}
				shell: bash
				run: |
					set -euo pipefail
					archive_name="$(echo "${{ inputs.image_repository }}_${{ inputs.image_tag }}" | tr '/:' '__').tar"
					archive_path="${{ inputs.image_output_dir }}/${archive_name}"
					sudo_cmd=""
					if command -v sudo >/dev/null 2>&1; then
						sudo_cmd="sudo"
					fi

					if [[ ! -f "$archive_path" ]]; then
						echo "Archive not found: $archive_path"
						exit 1
					fi

					if command -v k3s >/dev/null 2>&1; then
						$sudo_cmd k3s ctr images import "$archive_path"
					elif command -v ctr >/dev/null 2>&1; then
						$sudo_cmd ctr -n k8s.io images import "$archive_path"
					else
						echo "k3s/ctr not found; image stored locally only"
					fi
