name: helm deploy

on:
  workflow_call:
    inputs:
      service_name:
        type: string
        required: true
      release_name:
        type: string
        required: true
      namespace:
        type: string
        required: true
      chart_type:
        type: string
        required: true
      values_file:
        type: string
        required: true
      image_repository:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      kubeconfig:
        type: string
        default: /etc/rancher/k3s/k3s.yaml
    secrets:
      charts_repo_token:
        required: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: "[HELM] Check out code"
        uses: actions/checkout@v4

      - name: "[HELM] Checkout Helm charts"
        uses: actions/checkout@v4
        with:
          repository: AGH-iot-agent/Universal-Kubernetes-Helm-Charts
          path: .charts
          token: ${{ secrets.charts_repo_token || github.token }}

      - name: "[HELM] Set up Helm"
        uses: azure/setup-helm@v4

      - name: "[HELM] Materialize chart helper symlinks"
        shell: bash
        run: |
          set -euo pipefail

          find .charts/charts -type l -name '_helpers.tpl' | while read -r helper_link; do
            resolved_target="$(readlink -f "$helper_link")"

            if [[ -z "$resolved_target" || ! -f "$resolved_target" ]]; then
              echo "Broken helper symlink: $helper_link"
              exit 1
            fi

            rm "$helper_link"
            cp "$resolved_target" "$helper_link"
            echo "Materialized helper: $helper_link"
          done

      - name: "[HELM] Package chart"
        shell: bash
        run: |
          set -euo pipefail

          CHART_DIR=".charts/charts/${{ inputs.chart_type }}"
          PACKAGE_DIR="/mnt/storage/iot-agent/helm-charts/${{ inputs.service_name }}"

          [[ -d "$CHART_DIR" ]] || { echo "Missing chart: $CHART_DIR"; exit 1; }

          mkdir -p "$PACKAGE_DIR"
          helm dependency update "$CHART_DIR" >/dev/null 2>&1 || true
          helm package "$CHART_DIR" --destination "$PACKAGE_DIR"

          ls -lah "$PACKAGE_DIR"

      - name: "[HELM] Deploy"
        shell: bash
        env:
          KUBECONFIG: ${{ inputs.kubeconfig }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="/mnt/storage/iot-agent/helm-charts/${{ inputs.service_name }}"
          CHART="$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '${{ inputs.chart_type }}-*.tgz' | sort | tail -n 1)"

          [[ -n "$CHART" && -f "$CHART" ]] || { echo "Missing packaged chart in: $PACKAGE_DIR"; exit 1; }
          [[ -f "${{ inputs.values_file }}" ]] || { echo "Missing values file"; exit 1; }

          helm upgrade --install "${{ inputs.release_name }}" "$CHART" \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --wait --timeout 5m \
            -f "${{ inputs.values_file }}" \
            --set name="${{ inputs.service_name }}" \
            --set image.repository="${{ inputs.image_repository }}" \
            --set image.tag="${{ inputs.image_tag }}"