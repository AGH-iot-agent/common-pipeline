name: helm deploy

on:
  workflow_call:
    inputs:
      service_name:
        type: string
        required: true
      release_name:
        type: string
        required: true
      namespace:
        type: string
        required: true
      chart_type:
        type: string
        required: true
      values_file:
        type: string
        required: true
      image_repository:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      kubeconfig:
        type: string
        default: /etc/rancher/k3s/k3s.yaml
    secrets:
      charts_repo_token:
        required: false

jobs:
  deploy:
    runs-on: [self-hosted, iot-agent-local]

    steps:
      - name: "[HELM] Check out code"
        uses: actions/checkout@v4

      - name: "[HELM] Checkout Helm charts"
        uses: actions/checkout@v4
        with:
          repository: AGH-iot-agent/Universal-Kubernetes-Helm-Charts
          path: .charts
          token: ${{ secrets.charts_repo_token || github.token }}

      - name: "[HELM] Set up Helm"
        uses: azure/setup-helm@v4

      - name: "[HELM] Set up yq"
        shell: bash
        run: |
          set -euo pipefail
          YQ_BIN="/usr/local/bin/yq"
          if ! command -v yq >/dev/null 2>&1; then
            curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o "$YQ_BIN"
            chmod +x "$YQ_BIN"
          fi
          yq --version

      - name: "[HELM] Verify storage mount and kubeconfig"
        shell: bash
        env:
          KUBECONFIG: ${{ inputs.kubeconfig }}
        run: |
          set -euo pipefail
          STORAGE="/mnt/storage/iot-agent/helm-charts"

          if ! mkdir -p "$STORAGE" || ! touch "${STORAGE}/.write-test" 2>/dev/null; then
            echo "ERROR: Cannot write to $STORAGE"
            echo "Ensure /mnt/storage/iot-agent is bind-mounted in the runner container"
            exit 1
          fi
          rm -f "${STORAGE}/.write-test"
          echo "Storage mount OK: $STORAGE"

          if [[ ! -f "$KUBECONFIG" ]]; then
            echo "ERROR: KUBECONFIG not found at $KUBECONFIG"
            echo "Ensure /etc/rancher/k3s is bind-mounted in the runner container"
            exit 1
          fi
          echo "KUBECONFIG OK: $KUBECONFIG"

      - name: "[HELM] Materialize chart helper symlinks"
        shell: bash
        run: |
          set -euo pipefail

          find .charts/charts -type l -name '_helpers.tpl' | while read -r helper_link; do
            resolved_target="$(readlink -f "$helper_link")"

            if [[ -z "$resolved_target" || ! -f "$resolved_target" ]]; then
              echo "Broken helper symlink: $helper_link"
              exit 1
            fi

            rm "$helper_link"
            cp "$resolved_target" "$helper_link"
            echo "Materialized helper: $helper_link"
          done

      - name: "[HELM] Merge default and service values"
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SERVICE_NAME: ${{ inputs.service_name }}
          VALUES_FILE: ${{ inputs.values_file }}
        run: |
          set -euo pipefail

          CHART_DIR=".charts/charts/${{ inputs.chart_type }}"
          BASE_VALUES="${CHART_DIR}/values.yaml"
          SERVICE_VALUES="$VALUES_FILE"
          MERGED_VALUES=".charts/charts/${{ inputs.chart_type }}/values.merged.yaml"

          [[ -f "$BASE_VALUES" ]] || { echo "ERROR: Missing chart default values: $BASE_VALUES"; exit 1; }
          [[ -f "$SERVICE_VALUES" ]] || { echo "ERROR: Missing service values file: $SERVICE_VALUES"; exit 1; }

          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' "$BASE_VALUES" "$SERVICE_VALUES" > "$MERGED_VALUES"

          yq -i '.name = strenv(SERVICE_NAME)' "$MERGED_VALUES"
          yq -i '.image.repository = strenv(IMAGE_REPOSITORY)' "$MERGED_VALUES"
          yq -i '.image.tag = strenv(IMAGE_TAG)' "$MERGED_VALUES"

          cp "$MERGED_VALUES" "$BASE_VALUES"

          echo "Merged values prepared in: $BASE_VALUES"
          echo "Effective image: $(yq '.image.repository + ":" + .image.tag' "$BASE_VALUES")"

      - name: "[HELM] Package chart"
        shell: bash
        run: |
          set -euo pipefail

          CHART_DIR=".charts/charts/${{ inputs.chart_type }}"
          PACKAGE_DIR="/mnt/storage/iot-agent/helm-charts/${{ inputs.service_name }}"

          [[ -d "$CHART_DIR" ]] || { echo "ERROR: Missing chart dir: $CHART_DIR"; ls -la .charts/charts/ 2>/dev/null; exit 1; }

          mkdir -p "$PACKAGE_DIR"
          helm dependency update "$CHART_DIR" >/dev/null 2>&1 || true
          helm package "$CHART_DIR" --destination "$PACKAGE_DIR"

          echo "Packaged chart contents:"
          ls -lah "$PACKAGE_DIR"

          CHART_FILE="$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '${{ inputs.chart_type }}-*.tgz' | head -1)"
          if [[ -z "$CHART_FILE" ]]; then
            echo "ERROR: helm package succeeded but no .tgz file found matching '${{ inputs.chart_type }}-*.tgz'"
            exit 1
          fi
          echo "Chart file ready: $CHART_FILE"

      - name: "[HELM] Deploy"
        shell: bash
        env:
          KUBECONFIG: ${{ inputs.kubeconfig }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="/mnt/storage/iot-agent/helm-charts/${{ inputs.service_name }}"
          CHART="$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '${{ inputs.chart_type }}-*.tgz' | sort | tail -n 1)"

          [[ -n "$CHART" && -f "$CHART" ]] || { echo "ERROR: Missing packaged chart in: $PACKAGE_DIR"; ls -lah "$PACKAGE_DIR" 2>/dev/null; exit 1; }

          helm upgrade --install "${{ inputs.release_name }}" "$CHART" \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --wait --timeout 5m