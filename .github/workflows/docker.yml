name: docker build

on:
  workflow_call:
    inputs:
      image_repository:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      docker_context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      image_output_dir:
        type: string
        default: /mnt/storage/iot-agent/docker-local
      store_image_locally:
        type: boolean
        default: true
      import_to_k3s:
        type: boolean
        default: true

jobs:
  docker:
    runs-on: [self-hosted, iot-agent-local]

    steps:
      - name: "[DOCKER] Check out code"
        uses: actions/checkout@v4

      - name: "[DOCKER] Build image"
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.image_repository }}:${{ inputs.image_tag }}"

          if docker buildx version >/dev/null 2>&1; then
            docker build -f "${{ inputs.dockerfile }}" -t "$IMAGE" "${{ inputs.docker_context }}"
          else
            DOCKER_BUILDKIT=0 docker build -f "${{ inputs.dockerfile }}" -t "$IMAGE" "${{ inputs.docker_context }}"
          fi

      - name: "[DOCKER] Verify storage mount"
        shell: bash
        run: |
          set -euo pipefail
          MOUNT_DIR="${{ inputs.image_output_dir }}"
          if ! mkdir -p "${MOUNT_DIR}" || ! touch "${MOUNT_DIR}/.write-test" 2>/dev/null; then
            echo "ERROR: Cannot write to ${MOUNT_DIR}"
            echo "Ensure /mnt/storage/iot-agent is bind-mounted in the runner container"
            exit 1
          fi
          rm -f "${MOUNT_DIR}/.write-test"
          echo "Storage mount OK: ${MOUNT_DIR}"

      - name: "[DOCKER] Save image"
        if: ${{ inputs.store_image_locally }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.image_repository }}:${{ inputs.image_tag }}"
          ARCHIVE_DIR="${{ inputs.image_output_dir }}/${{ inputs.image_repository }}"
          ARCHIVE="${ARCHIVE_DIR}/$(echo "$IMAGE" | tr '/:' '__').tar"

          mkdir -p "$ARCHIVE_DIR"
          docker save -o "$ARCHIVE" "$IMAGE"

          echo "Saved: $ARCHIVE"

      - name: "[DOCKER] Import to k3s"
        if: ${{ inputs.import_to_k3s }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ inputs.image_repository }}:${{ inputs.image_tag }}"
          ARCHIVE_DIR="${{ inputs.image_output_dir }}/${{ inputs.image_repository }}"
          ARCHIVE="${ARCHIVE_DIR}/$(echo "$IMAGE" | tr '/:' '__').tar"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "ERROR: Missing archive: $ARCHIVE"
            ls -lah "$ARCHIVE_DIR" 2>/dev/null || echo "Directory does not exist: $ARCHIVE_DIR"
            exit 1
          fi

          K3S_SOCK="/run/k3s/containerd/containerd.sock"
          if [[ ! -S "$K3S_SOCK" ]]; then
            echo "ERROR: k3s containerd socket not found at $K3S_SOCK"
            echo "Ensure /run/k3s is bind-mounted in the runner container"
            exit 1
          fi

          SUDO=""
          command -v sudo >/dev/null && SUDO="sudo"

          if command -v k3s >/dev/null; then
            $SUDO "$(command -v k3s)" ctr images import "$ARCHIVE"
          elif command -v ctr >/dev/null; then
            $SUDO "$(command -v ctr)" --address "$K3S_SOCK" -n k8s.io images import "$ARCHIVE"
          elif [[ -x /usr/local/bin/k3s ]]; then
            $SUDO /usr/local/bin/k3s ctr images import "$ARCHIVE"
          else
            echo "ERROR: Neither k3s nor ctr binary found in PATH"
            echo "Install containerd.io package in the runner image or mount /usr/bin/ctr from the host"
            exit 1
          fi

          echo "Image imported to k3s: $IMAGE"