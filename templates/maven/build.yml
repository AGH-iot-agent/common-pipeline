name: maven build

on:
	workflow_call:
		inputs:
			java_version:
				required: false
				type: string
				default: "21"
			maven_args:
				required: false
				type: string
				default: "-B clean package -DskipTests"
			working_directory:
				required: false
				type: string
				default: .

jobs:
	build:
		runs-on: self-hosted
		defaults:
			run:
				working-directory: ${{ inputs.working_directory }}
		steps:
			- name: Check out code
				uses: actions/checkout@v4

			- name: Set up JDK
				uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: ${{ inputs.java_version }}
					cache: maven

			- name: Build Maven project
				shell: bash
				run: |
					set -euo pipefail
					if [[ -f ./mvnw ]]; then
						chmod +x ./mvnw
						./mvnw ${{ inputs.maven_args }}
					elif command -v mvn >/dev/null 2>&1; then
						mvn ${{ inputs.maven_args }}
					else
						echo "Neither mvnw nor mvn is available"
						exit 1
					fi
